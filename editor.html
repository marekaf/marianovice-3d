<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Garden — 2D drag-drop editor</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
  .toolbar { background: #2a2a2a; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
  .toolbar button { background: #5dade2; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .toolbar button:hover { background: #3a8fc9; }
  .toolbar .info { font-size: 13px; opacity: 0.85; }
  .toolbar .coord { background: #444; padding: 4px 10px; border-radius: 4px; font-family: monospace; font-size: 13px; }
  #svgWrap { padding: 20px; display: flex; justify-content: center; }
  svg { background: white; box-shadow: 0 2px 12px rgba(0,0,0,0.1); max-width: 100%; height: auto; }
  .el[data-draggable] { cursor: move; transition: filter 0.15s; }
  .el[data-draggable]:hover { filter: drop-shadow(0 0 6px rgba(93, 173, 226, 0.7)); }
  .el.dragging { filter: drop-shadow(0 0 8px rgba(255, 100, 0, 0.8)); opacity: 0.85; }
</style>
</head>
<body>

<div class="toolbar">
  <button id="exportSvgBtn">⬇ Export SVG</button>
  <button id="exportLayoutBtn">⬇ Export layout.js</button>
  <button id="resetBtn">↺ Reset</button>
  <span class="info">Drag elements with mouse or touch. Snap to 1 m.</span>
  <span class="coord" id="coord">—</span>
</div>

<div id="svgWrap"></div>

<script src="layout.js?v=20260828g"></script>
<script src="plan.js?v=20260828g"></script>
<script>
(function() {
  const SNAP_M = 1;
  const ROWS = 'abcdefghijklmnopqrstuvwxyz';
  const wrap = document.getElementById('svgWrap');
  const coordEl = document.getElementById('coord');

  let working = structuredClone(GARDEN);
  const SNAP_PX = SNAP_M * working.m2px;

  function bboxMin(el) {
    let mx = Infinity, my = Infinity;
    for (const p of el.parts) {
      if (p.kind === 'rect') { mx = Math.min(mx, p.x); my = Math.min(my, p.y); }
      else if (p.kind === 'polygon') for (const [x, y] of p.points) { mx = Math.min(mx, x); my = Math.min(my, y); }
      else if (p.kind === 'ellipse') { mx = Math.min(mx, p.cx - p.rx); my = Math.min(my, p.cy - p.ry); }
      else if (p.kind === 'circle') { mx = Math.min(mx, p.cx - p.r); my = Math.min(my, p.cy - p.r); }
      else if (p.kind === 'line') { mx = Math.min(mx, p.x1, p.x2); my = Math.min(my, p.y1, p.y2); }
    }
    return [mx, my];
  }

  function cellAddress(x, y) {
    const c = working.gridCellM;
    const col = Math.floor(x / c) + 1;
    const row = ROWS[Math.max(0, Math.floor(y / c))] || '?';
    return `${col}${row}`;
  }

  function shiftElement(el, dx, dy) {
    for (const p of el.parts) {
      if (p.kind === 'rect' || p.kind === 'text') { p.x += dx; p.y += dy; }
      else if (p.kind === 'polygon') p.points = p.points.map(([x, y]) => [x + dx, y + dy]);
      else if (p.kind === 'ellipse' || p.kind === 'circle') { p.cx += dx; p.cy += dy; }
      else if (p.kind === 'line') { p.x1 += dx; p.y1 += dy; p.x2 += dx; p.y2 += dy; }
    }
  }

  function download(name, content, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
    URL.revokeObjectURL(url);
  }

  function render() {
    wrap.innerHTML = renderPlanSVG(working);
    const svg = wrap.querySelector('svg');
    svg.querySelectorAll('.el').forEach(g => {
      const el = working.elements.find(e => e.id === g.dataset.id);
      if (!el || el.fixed) return;
      g.setAttribute('data-draggable', '');
      g.addEventListener('pointerdown', ev => startDrag(ev, g, el, svg));
    });
  }

  function clientToSvg(svg, clientX, clientY) {
    const pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function startDrag(ev, g, el, svg) {
    ev.preventDefault();
    g.setPointerCapture(ev.pointerId);
    g.classList.add('dragging');
    const start = clientToSvg(svg, ev.clientX, ev.clientY);
    let dxPx = 0, dyPx = 0;

    const onMove = e => {
      const now = clientToSvg(svg, e.clientX, e.clientY);
      dxPx = Math.round((now.x - start.x) / SNAP_PX) * SNAP_PX;
      dyPx = Math.round((now.y - start.y) / SNAP_PX) * SNAP_PX;
      g.setAttribute('transform', `translate(${dxPx}, ${dyPx})`);
      const dxM = dxPx / working.m2px, dyM = dyPx / working.m2px;
      const [bx, by] = bboxMin(el);
      coordEl.textContent = `${el.id} → ${cellAddress(bx + dxM, by + dyM)} (Δ ${dxM.toFixed(1)}, ${dyM.toFixed(1)} m)`;
    };
    const onUp = () => {
      g.removeEventListener('pointermove', onMove);
      g.removeEventListener('pointerup', onUp);
      g.removeEventListener('pointercancel', onUp);
      g.classList.remove('dragging');
      if (dxPx || dyPx) {
        shiftElement(el, dxPx / working.m2px, dyPx / working.m2px);
        render();
      }
    };
    g.addEventListener('pointermove', onMove);
    g.addEventListener('pointerup', onUp);
    g.addEventListener('pointercancel', onUp);
  }

  document.getElementById('exportSvgBtn').addEventListener('click', () => {
    download('zahrada-plan.svg', renderPlanSVG(working), 'image/svg+xml');
  });
  document.getElementById('exportLayoutBtn').addEventListener('click', () => {
    download('layout.js', serializeLayout(working), 'text/javascript');
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    working = structuredClone(GARDEN);
    coordEl.textContent = '—';
    render();
  });

  render();
})();
</script>

</body>
</html>
