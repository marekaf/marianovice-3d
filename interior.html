<title>Interiors — orthographic views</title>
<style>
  body { margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f3f2ef; }
  [hidden] { display: none !important; }
  #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.75); color: white; padding: 10px 14px; z-index: 100; border-radius: 6px; max-width: 300px; }
  #info h3 { margin: 0 0 4px 0; font-size: 15px; }
  #info small { opacity: 0.85; }
  #info a { color: #5dade2; }
  #views { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.75); padding: 10px 12px; z-index: 100; border-radius: 6px; width: 178px; max-height:calc(100dvh - 40px); overflow-y:auto; }
  #views h4 { color: #fff; margin: 8px 0 6px 0; font-size: 12px; opacity: 0.85; }
  #views h4:first-child { margin-top: 0; }
  #views button { display: block; width: 100%; margin: 4px 0; padding: 6px 12px; cursor: pointer; background: #5dade2; color: white; border: none; border-radius: 4px; font-size: 13px; text-align: left; }

  #scaleline { height: 0; border-bottom: 3px solid #222; margin-bottom: 3px; }

  <button data-view="utility" data-house-focus hidden>Utility equipment</button>

<script src="garage-model.js?v=cdb29f4bf771"></script>
<script src="furniture-model.js?v=6c32ded6b6ca"></script>
<script src="privacy-screen-model.js"></script>
<script src="sauna-model.js?v=5d9cb500c019"></script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mountInteriorUI } from './interior-ui.js';
import { attachEyeLevelWalkthrough } from './docs/eye-level-walkthrough.js?v=f53642429967';
import { ELECTRICAL_POINTS } from './docs/electrical-points.js';
import { attachElectricalView } from './docs/electrical-view.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildModel } from './model3d.js?v=c01f6fdccf42';

RectAreaLightUniformsLib.init();
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3f2ef);

// Flat, even light — elevations should read like drawings, not renders (no shadow map)
const ambientLight = new THREE.HemisphereLight(0xffffff, 0xd8d5d0, 1.05);
scene.add(ambientLight);
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(-6, 14, 9);
scene.add(sun);
scene.add(sun.target);
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: .5, far: 60 });
sun.shadow.normalBias = .01;

// Garage at its real level (−0.5 m below the house floor at 0)
const gar = INTERIORS3D.buildGarage(THREE, GARDEN, { floorY: -0.5, buildModel });
const garRoot = new THREE.Group();
for (const grp of [gar.walls.N, gar.walls.S, gar.walls.E, gar.walls.W, gar.floor, gar.furniture, gar.gateClosed, gar.gateOpen, gar.ceiling, gar.light]) garRoot.add(grp);
const vehicles = INTERIORS3D.garageVehicles(THREE, GARDEN, -0.5, buildModel);
garRoot.add(vehicles);
scene.add(garRoot);

const saunaModel = SaunaModel.build(GARDEN, 0);
const saunaRoot = buildModel(THREE, { ...saunaModel, floorHeight: 0 });
const saunaCategories = saunaRoot.userData.categories;
saunaCategories.outdoor.visible = false;
for (const light of saunaRoot.userData.lights) light.intensity = Math.min(0.35, light.userData.night);
scene.add(saunaRoot);
const SA = GARDEN.elements.find(e => e.id === 'sauna').parts.find(p => p.kind === 'rect');

const hasHouse = typeof HOUSE_INTERIOR !== 'undefined';
let officeIntegration = null;
let officeFloorTexture = null;
let livingIntegration = null;
let bathroomFinishes = null;
let utilityIntegration = null;
let loftIntegration = null;
let stairIntegration = null;
let ledIntegration = null;
let entranceIntegration = null;
let kitchenWindowIntegration = null;
let cathedralIntegration = null;
if (hasHouse) {
  try {
    const module = await import('./docs/office-integration.js');
    officeIntegration = await module.loadOfficeIntegration();
    officeFloorTexture = module.applyChampagneFloor;
  } catch (error) {
    document.getElementById('fitoutStatus').textContent = `Office fit-out unavailable: ${error.message}`;
  }
  try {
    livingIntegration = await import('./docs/living-interior.js?v=eac030111e30');
    const {createBathroomFinishes}=await import('./docs/bathroom-finishes.js');
    bathroomFinishes=createBathroomFinishes(THREE,HOUSE_INTERIOR);
    utilityIntegration=await import('./docs/utility-equipment.js');
    loftIntegration=await import('./docs/loft-interior.js');
    stairIntegration=await import('./docs/stair-finishes.js');
    ledIntegration=await import('./docs/interior-led.js');
    entranceIntegration=await import('./docs/entrance-interior.js');
    kitchenWindowIntegration=await import('./docs/kitchen-window-worktop.js');
    cathedralIntegration=await import('./docs/cathedral-interior.js');
  } catch (error) {
    document.getElementById('fitoutStatus').textContent += ` Living fit-out unavailable: ${error.message}`;
  }
}
let hou = null;
let renderedHouseData = null;
if (hasHouse) {
  const finishedData = livingIntegration?.prepareLivingData(HOUSE_INTERIOR) ?? HOUSE_INTERIOR;
  const livingData = kitchenWindowIntegration?.prepareKitchenWindowData(finishedData) ?? finishedData;
  const houseData = entranceIntegration?.prepareEntranceData(livingData) ?? livingData;
  renderedHouseData = houseData;
  hou = INTERIORS3D.buildHouse(THREE, houseData, { floorY: 0, buildModel,
    finishColors: livingIntegration?.finishColors,
    decorateWallMesh: (mesh, wall) => {
      officeIntegration?.decorateWallMesh(THREE, mesh, wall, HOUSE_INTERIOR);
      bathroomFinishes?.decorateWallMesh(mesh,wall);
    } });
  scene.add(hou.root);
  document.getElementById('houseBtn').style.display = '';
}
const hasLoft = typeof HOUSE_LOFT !== 'undefined';
let loft = null;
if (hasLoft) {
  loft = INTERIORS3D.buildHouse(THREE, {...HOUSE_LOFT,intWalls:HOUSE_LOFT.intWalls.filter(w=>w.id!=='P13')}, { floorY: 2.72, buildModel,finishColors:loftIntegration?.finishColors });
  scene.add(loft.root);
  document.getElementById('loftBtn').style.display = '';
}

const GA = gar.dims.rect;
const renderer = new THREE.WebGLRenderer({ antialias: true });
const reflectionRoom = new RoomEnvironment();
const reflectionGenerator = new THREE.PMREMGenerator(renderer);
const reflectionMap = reflectionGenerator.fromScene(reflectionRoom, .04);
scene.environment = reflectionMap.texture;
scene.environmentIntensity = .65;
reflectionRoom.dispose();
reflectionGenerator.dispose();
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
if (officeIntegration) {
  officeIntegration.attach(THREE, hou, HOUSE_INTERIOR, { buildModel, renderer });
  document.getElementById('officeLinks').hidden = false;
}
const livingFitout = livingIntegration?.attachLivingInterior(THREE, hou, HOUSE_INTERIOR, { buildModel, renderer, applyChampagneFloor: officeFloorTexture });
const ledFitout=ledIntegration?.attachInteriorLed(THREE,hou,renderedHouseData);
const entranceFitout=entranceIntegration?.attachEntranceInterior(THREE,hou,renderedHouseData,{buildModel});
const kitchenWindowFitout=kitchenWindowIntegration?.attachKitchenWindowWorktop(THREE,hou,renderedHouseData);
const cathedralFitout=cathedralIntegration?.attachCathedralInterior(THREE,hou,renderedHouseData);
if(cathedralFitout)Object.assign(livingFitout.presets,cathedralFitout.presets);
if(entranceFitout)Object.assign(livingFitout.presets,entranceFitout.presets);
bathroomFinishes?.attach(hou);
const stairFitout=stairIntegration?.attachStairFinishes(THREE,hou,HOUSE_INTERIOR,{renderer});
const utilityFitout=utilityIntegration?.attachUtilityEquipment(THREE,hou,HOUSE_INTERIOR,{buildModel});
const loftFitout=loft&&loftIntegration?.attachLoftInterior(THREE,loft,HOUSE_LOFT,{buildModel,renderer,applyChampagneFloor:officeFloorTexture});
if(utilityFitout)Object.assign(livingFitout.presets,utilityFitout.presets);
if (livingFitout) document.getElementById('fitoutProposal').textContent = livingFitout.proposal;
if(livingFitout?.showerModel){
  const details=document.createElement('details');details.id='showerNotes';
  const summary=document.createElement('summary');summary.textContent='Shower fit and placement notes';
  const note=document.createElement('small');note.textContent=livingFitout.showerModel.notes.join(' ');
  details.append(summary,note);document.getElementById('info').append(details);
}
if(utilityFitout){
  const details=document.createElement('details');details.id='utilityNotes';
  const summary=document.createElement('summary');summary.textContent='Equipment placement notes';
  const note=document.createElement('small');note.textContent=utilityFitout.notes.join(' ');
  details.append(summary,note);document.getElementById('info').append(details);
}

const drawingCamera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 300);
const eyeCamera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, .025, 300);
let camera = drawingCamera;
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = false;

// Per-building view sets: camera placement, what to hide (the wall you look through), fit extents
function mkViews(cx, cz, midY, w, d, wallH, label) {
  return {
    plan:  { label: `${label} — FLOOR PLAN (north up)`, pos: [cx, 60, cz], up: [0, 0, -1], target: [cx, 0, cz], lookThrough: [], cut: false, ceil: false, fitW: w + 1.6, fitH: d + 1.6, rotate: false },
    north: { label: `${label} — NORTH WALL`, pos: [cx, midY, cz + 60], up: [0, 1, 0], target: [cx, midY, cz], lookThrough: ['S'], cut: false, ceil: false, fitW: w + 1.2, fitH: wallH, rotate: false },
    south: { label: `${label} — SOUTH WALL`, pos: [cx, midY, cz - 60], up: [0, 1, 0], target: [cx, midY, cz], lookThrough: ['N'], cut: false, ceil: false, fitW: w + 1.2, fitH: wallH, rotate: false },
    east:  { label: `${label} — EAST WALL`, pos: [cx - 60, midY, cz], up: [0, 1, 0], target: [cx, midY, cz], lookThrough: ['W'], cut: false, ceil: false, fitW: d + 1.2, fitH: wallH, rotate: false },
    west:  { label: `${label} — WEST WALL`, pos: [cx + 60, midY, cz], up: [0, 1, 0], target: [cx, midY, cz], lookThrough: ['E'], cut: false, ceil: false, fitW: d + 1.2, fitH: wallH, rotate: false },
    cut3d: { label: `${label} — CUTAWAY 3D`, pos: [cx + Math.max(w, d), Math.max(w, d) * 0.9, cz + Math.max(w, d)], up: [0, 1, 0], target: [cx, 0.8, cz], lookThrough: [], cut: false, ceil: false, fitW: w + d * 0.6, fitH: (w + d) * 0.42, rotate: true },
  };
}
const garageViews = mkViews(GA.x + GA.w / 2, GA.y + GA.d / 2, -0.5 + 1.6, GA.w, GA.d, 4.4, 'GARAGE');
garageViews.cut3d.fitH += 1;
garageViews.cut3d.target[1] = 1.1;
const saunaViews = mkViews(SA.x + SA.w / 2, SA.y + SA.d / 2, 1.1, SA.w, SA.d, 4.4, 'SAUNA');
saunaViews.cut3d.fitH = 5.2;
saunaViews.cut3d.target[1] = 1;
const BUILDINGS = {
  garage: {
    root: garRoot, walls: gar.walls, ceiling: gar.ceiling,
    views: garageViews,
    dims: `garage · ${GA.w.toFixed(2)} × ${GA.d.toFixed(2)} m outside · floor −0.50 m`,
  },
  sauna: {
    root: saunaRoot,
    walls: { N: saunaCategories.N, S: saunaCategories.S, E: saunaCategories.E, W: saunaCategories.W },
    ceiling: saunaCategories.roof,
    furniture: saunaCategories.furniture,
    views: saunaViews,
    dims: `sauna · ${SA.w.toFixed(2)} × ${SA.d.toFixed(2)} m outside · clear height 2.50 m`,
  },
};
if (hasHouse) {
  const o = hou.dims.originPlot;
  BUILDINGS.house = {
    root: hou.root, walls: hou.walls, ceiling: hou.ceiling, labels: hou.labels, wallIds: hou.wallIds, furniture: hou.furniture,
    views: mkViews(o.x + hou.dims.w / 2, o.z + hou.dims.d / 2, 1.5, hou.dims.w, hou.dims.d, 3.6, 'HOUSE 1.NP'),
    dims: `house 1.NP · ${hou.dims.w.toFixed(2)} × ${hou.dims.d.toFixed(2)} m outside · clear height ${hou.dims.clearH.toFixed(2)} m`,
  };
  if (livingFitout) for (const [name, preset] of Object.entries(livingFitout.presets)) {
    const world = ([x, y, z]) => [x + o.x, y + hou.dims.floorY, z + o.z];
    BUILDINGS.house.views[name] = { label: name === 'overview' ? 'HOUSE · LIVING ROOM OVERVIEW' : `HOUSE · ${name === 'garden' ? 'TOWARD EAST PORTAL' : name.toUpperCase()} · EYE LEVEL`,
      pos: world(preset.position), target: world(preset.target), up: [0, 1, 0],
      lookThrough: [], cut: false, ceil: true, rotate: true, perspective: true };
  }
}
if (hasLoft) {
  const o = loft.dims.originPlot;
  BUILDINGS.loft = {
    root: loft.root, walls: loft.walls, ceiling: loft.ceiling, labels: loft.labels, wallIds: loft.wallIds, furniture: loft.furniture,
    views: mkViews(o.x + loft.dims.w / 2, o.z + loft.dims.d / 2, 2.72 + 1.1, loft.dims.w, loft.dims.d, 3.2, 'HOUSE PODKROVÍ'),
    dims: `podkroví · 2.01–2.03 · clear 0.85–2.27 m · floor +2.72`,
  };
}

if(loftFitout)for(const[name,preset]of Object.entries(loftFitout.presets)){
  const o=loft.dims.originPlot,world=([x,y,z])=>[x+o.x,y+loft.dims.floorY,z+o.z];
  BUILDINGS.loft.views[name]={label:`LOFT · ${name.toUpperCase()}`,pos:world(preset.position),target:world(preset.target),up:[0,1,0],lookThrough:[],cut:false,ceil:true,rotate:true,perspective:true};
}
let curB = hasHouse ? 'house' : 'garage', curV = 'cut3d';
let walkthrough = null;
let electrical = null;

function applyVisibility() {
  walkthrough?.setVisible(curB === 'house');
  const B = BUILDINGS[curB];
  const hidden = new Set(B.views[curV].lookThrough);
  if (document.getElementById('toggleCut').checked) { hidden.add('S'); hidden.add('E'); }
  for (const b in BUILDINGS) BUILDINGS[b].root.visible = (b === curB);
  for (const k of ['N', 'S', 'E', 'W']) B.walls[k].visible = !hidden.has(k);
  B.ceiling.visible = document.getElementById('toggleCeiling').checked;
  if (curB === 'garage') {
    const gateOpen = document.getElementById('toggleGate').checked;
    gar.gateClosed.visible = !hidden.has('S') && !gateOpen;
    gar.gateOpen.visible = !hidden.has('S') && gateOpen;
    vehicles.visible = document.getElementById('toggleVehicles').checked;
  }
  for (const b in BUILDINGS) if (BUILDINGS[b].labels) BUILDINGS[b].labels.visible = (b === curB) && !camera.isPerspectiveCamera && document.getElementById('toggleLabels').checked;
  for (const b in BUILDINGS) if (BUILDINGS[b].wallIds) BUILDINGS[b].wallIds.visible = (b === curB) && document.getElementById('toggleWallIds').checked;
  for (const b in BUILDINGS) if (BUILDINGS[b].furniture) BUILDINGS[b].furniture.visible = (b === curB) && document.getElementById('toggleJoinery').checked;
  document.getElementById('rowJoinery').style.display = BUILDINGS[curB].furniture ? '' : 'none';
  document.getElementById('rowWallIds').style.display = BUILDINGS[curB].wallIds ? '' : 'none';
  document.getElementById('rowGate').style.display = curB === 'garage' ? '' : 'none';
  document.getElementById('rowVehicles').style.display = curB === 'garage' ? '' : 'none';
  document.getElementById('rowLabels').style.display = BUILDINGS[curB].labels && !camera.isPerspectiveCamera ? '' : 'none';
  for (const button of document.querySelectorAll('[data-house-focus]')) button.hidden = curB !== 'house' || !livingFitout;
  for (const button of document.querySelectorAll('[data-loft-focus]')) button.hidden = curB !== 'loft' || !loftFitout;
  if(document.getElementById('utilityNotes'))document.getElementById('utilityNotes').hidden=curB!=='house'||!['utility','utilityLaundry','utilityRack'].includes(curV);
  if(document.getElementById('showerNotes'))document.getElementById('showerNotes').hidden=curB!=='house'||!['bathroom','mainShower','guestShower'].includes(curV);
  const proposal = document.getElementById('fitoutProposal');
  proposal.hidden = !((curB === 'house' && livingFitout) || (curB === 'loft' && loftFitout));
  proposal.textContent = curB === 'loft' && loftFitout ? loftFitout.notes.slice(1, 5).join(' ') : livingFitout?.proposal || '';
  if(curB==='house'&&['entrance','entranceSeat','entranceCoats','entranceControls'].includes(curV)&&entranceFitout)proposal.textContent=entranceFitout.notes.join(' ');
  if(curB==='house'&&curV==='cathedral'&&cathedralFitout)proposal.textContent=cathedralFitout.notes;
  electrical?.update(curB);
}

function fitFrustum() {
  const v = BUILDINGS[curB].views[curV];
  const aspect = innerWidth / innerHeight;
  if (camera.isPerspectiveCamera) {
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
    return;
  }
  let halfH = (v.fitH / 2) * 1.08;
  if ((v.fitW / 2) * 1.08 > halfH * aspect) halfH = (v.fitW / 2) * 1.08 / aspect;
  camera.left = -halfH * aspect; camera.right = halfH * aspect;
  camera.top = halfH; camera.bottom = -halfH;
  camera.updateProjectionMatrix();
}

function setView(name) {
  walkthrough?.stop();
  curV = name;
  const v = BUILDINGS[curB].views[name];
  camera = v.perspective ? eyeCamera : drawingCamera;
  controls.object = camera;
  renderer.shadowMap.enabled = Boolean(v.perspective);
  renderer.toneMapping = v.perspective ? THREE.ACESFilmicToneMapping : THREE.NoToneMapping;
  renderer.toneMappingExposure = 1;
  ambientLight.intensity = v.perspective ? 2 : 1.05;
  sun.intensity = v.perspective ? 2.8 : .9;
  sun.castShadow = Boolean(v.perspective);
  if (v.perspective) { sun.position.set(35, 8, 18); sun.target.position.set(17, 1, 18); }
  else { sun.position.set(-6, 14, 9); sun.target.position.set(0, 0, 0); }
  camera.up.set(...v.up);
  camera.position.set(...v.pos);
  camera.zoom = 1;
  controls.target.set(...v.target);
  controls.enableRotate = v.rotate;
  document.getElementById('toggleCut').checked = v.cut;
  document.getElementById('toggleCeiling').checked = v.ceil;
  fitFrustum();
  controls.update();
  applyVisibility();
  document.getElementById('viewlabel').textContent = v.label;
  document.getElementById('dims').textContent = BUILDINGS[curB].dims;
  document.querySelectorAll('#views button[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  document.querySelectorAll('#views button[data-building]').forEach(b => b.classList.toggle('active', b.dataset.building === curB));
  if (document.querySelector(`#views button[data-view="${name}"]`)) {
    history.replaceState(null, '', `#${curB}-${name}`);
  }
  updateScalebar();
}

function setBuilding(b) {
  if (!BUILDINGS[b]) return;
  curB = b;
  setView(BUILDINGS[b].views[curV] ? curV : 'plan');
}

function updateScalebar() {
  document.getElementById('scalebar').hidden = camera.isPerspectiveCamera;
  if (camera.isPerspectiveCamera) return;
  const mPerPx = (camera.right - camera.left) / (camera.zoom * innerWidth);
  document.getElementById('scaleline').style.width = (1 / mPerPx) + 'px';
  document.getElementById('scaletext').textContent = '1 m';
}

document.querySelectorAll('#views button[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
document.querySelectorAll('#views button[data-building]').forEach(b => b.addEventListener('click', () => setBuilding(b.dataset.building)));
for (const id of ['toggleGate', 'toggleVehicles', 'toggleCut', 'toggleCeiling', 'toggleLabels', 'toggleJoinery', 'toggleWallIds']) {
  document.getElementById(id).addEventListener('change', applyVisibility);
}
controls.addEventListener('change', updateScalebar);

// The scale bar is a DOM overlay, so it is not in the WebGL buffer. A plan sheet without its scale
// cannot be measured off, so redraw it into the exported bitmap rather than exporting the bare canvas.
function paintScalebar(ctx, s) {
  if (camera.isPerspectiveCamera) return;
  const mPerPx = (camera.right - camera.left) / (camera.zoom * innerWidth);
  const line = (1 / mPerPx) * s;
  const padX = 10 * s, padY = 6 * s, font = 11 * s;
  const boxW = line + padX * 2, boxH = padY * 2 + 3 * s + 3 * s + font;
  const x = 14 * s, y = ctx.canvas.height - 14 * s - boxH;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.strokeStyle = '#999';
  ctx.lineWidth = s;
  ctx.beginPath();
  ctx.roundRect(x, y, boxW, boxH, 4 * s);
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 3 * s;
  ctx.beginPath();
  ctx.moveTo(x + padX, y + padY + 1.5 * s);
  ctx.lineTo(x + padX + line, y + padY + 1.5 * s);
  ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.font = font + 'px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillText('1 m', x + padX, y + padY + 6 * s);
  ctx.restore();
}

// PNG export of exactly what is on screen — render synchronously, then read the canvas
document.getElementById('exportBtn').addEventListener('click', () => {
  renderer.render(scene, camera);
  const gl = renderer.domElement;
  const out = document.createElement('canvas');
  out.width = gl.width;
  out.height = gl.height;
  const ctx = out.getContext('2d');
  ctx.drawImage(gl, 0, 0);
  paintScalebar(ctx, gl.width / innerWidth);
  const a = document.createElement('a');
  a.download = `${curB}-${curV}.png`;
  a.href = out.toDataURL('image/png');
  a.click();
});

window.addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  fitFrustum();
  updateScalebar();
});

// Deep-link via URL hash: #plan / #house-plan / #garage-cut3d / …
function applyHash() {
  const h = location.hash.slice(1);
  if (!h) return setView('cut3d');
  const [a, b] = h.includes('-') ? h.split('-') : [null, h];
  if (a && BUILDINGS[a]) curB = a;
  setView(BUILDINGS[curB].views[b] ? b : 'plan');
}
if (hasHouse) walkthrough = attachEyeLevelWalkthrough(THREE, {
  data: renderedHouseData, floorY: hou.dims.floorY, camera: eyeCamera, controls,
  canvas: renderer.domElement, container: document.getElementById('views'),
  activate(preset, height) {
    const o = hou.dims.originPlot;
    curB = 'house';
    BUILDINGS.house.views.walk = {
      label: `HOUSE · WALK · ${preset.label.toUpperCase()}`,
      pos: [o.x+preset.position[0],hou.dims.floorY+height,o.z+preset.position[1]],
      target: [o.x+preset.target[0],hou.dims.floorY+height,o.z+preset.target[1]],
      up: [0,1,0], lookThrough: [], cut: false, ceil: true, rotate: true, perspective: true,
    };
    setView('walk');
  },
});
const garageElectricalRoot = new THREE.Group();
garageElectricalRoot.position.set(gar.dims.rect.x,0,gar.dims.rect.y);
garRoot.add(garageElectricalRoot);
try {
electrical = attachElectricalView(THREE, {
  ...(hasHouse?{house:{house:hou,data:HOUSE_INTERIOR,finishPanels:livingFitout?.parts.filter(p=>p.material==='whiteGlass')??[]}}:{}),
  ...(hasLoft?{loft:{house:loft,data:HOUSE_LOFT}}:{}),
  garage:{house:{root:garageElectricalRoot,dims:gar.dims,walls:gar.walls},data:{extWalls:Object.keys(gar.walls).map(face=>({id:face,face}))}},
}, ELECTRICAL_POINTS, document.getElementById('views'), point => {
  const building=point.building;
  if(!BUILDINGS[building])return;
  const house=building==='house'?hou:building==='loft'?loft:null;
  const origin=house?.dims.originPlot??{x:gar.dims.rect.x,z:gar.dims.rect.y};
  const floorY=house?.dims.floorY??gar.dims.floorY;
  const target=[point.position[0]+origin.x,point.position[1]+floorY,point.position[2]+origin.z];
  const pos=target.map((v,i)=>v+point.normal[i]*.8+(i===1?.15:0));
  curB=building;
  BUILDINGS[building].views.electricalPoint={label:`${point.id} · ${point.kind.toUpperCase()}`,pos,target,up:point.normal[1]?[0,0,-1]:[0,1,0],lookThrough:[],cut:false,ceil:true,rotate:true,perspective:true};
  setView('electricalPoint');
});
} catch(error) {
  const status=document.createElement('p');
  status.id='electricalError';
  status.textContent=`Electrical overlay unavailable: ${error.message}`;
  document.getElementById('views').append(status);
}
applyHash();
mountInteriorUI();
window.addEventListener('hashchange', applyHash);

window.DEBUG = { scene, get camera() { return camera; }, walkthrough, electrical, gar, livingFitout,utilityFitout,loftFitout,stairFitout,ledFitout,entranceFitout,kitchenWindowFitout,cathedralFitout,
  sau: { root: saunaRoot, model: saunaModel, categories: saunaCategories, walls: BUILDINGS.sauna.walls,
    ceiling: saunaCategories.roof, furniture: saunaCategories.furniture, dims: { rect: SA, floorY: 0, clearH: 2.5 } },
  hou: hasHouse ? hou : null, loft: hasLoft ? loft : null };
renderer.setAnimationLoop(time => {
  walkthrough?.update(time);
  if (!walkthrough?.active) controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
