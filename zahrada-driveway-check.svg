    <text x="0" y="183" class="pt" fill="#555">Yellow strips are proposed pedestrian routes.</text>
    <text x="0" y="195" class="pt" fill="#555">Open car doors are illustrative, not collision-tested.</text>
    <text x="0" y="207" class="pt" fill="#555">Body gaps exclude mirrors, users and luggage.</text>
    <text x="0" y="219" class="pt" fill="#555">Garage edge allows for walls and workbench.</text>
    <text x="0" y="231" class="pt" fill="#555">Carport posts are not included in gap figures.</text>
    <text x="0" y="243" class="pt" fill="#555">Confirm door access and walkways on site.</text>
