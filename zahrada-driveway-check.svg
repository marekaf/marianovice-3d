<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <pattern id="cg" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#e2e2e2" stroke-width="0.6"/></pattern>
    <pattern id="mg" width="180" height="180" patternUnits="userSpaceOnUse"><rect width="180" height="180" fill="url(#cg)"/><path d="M 180 0 L 0 0 0 180" fill="none" stroke="#bcbcbc" stroke-width="1"/></pattern>
    <clipPath id="plot"><polygon points="0,0 794.88,0 794.88,420.84 775.98,637.38 20.7,547.38"/></clipPath>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,sans-serif;fill:#2a2a2a}
    .title{font-size:18px;font-weight:700;text-anchor:middle}
    .sub{font-size:11px;fill:#666;text-anchor:middle}
    .axis{font-size:9px;fill:#777;text-anchor:middle;font-weight:600}
    .lbl{font-size:10px;font-weight:700;text-anchor:middle}
    .dim{font-size:9px;fill:#1f6f43;text-anchor:middle;font-weight:600}
    .ph{font-size:11px;font-weight:700}
    .pt{font-size:9px}
    .ok{font-size:10px;font-weight:700;fill:#1f7a3d}
  </style>
  <rect width="1100" height="880" fill="white"/>
  <text x="440" y="26" class="title">Driveway maneuvering check — gate → carport</text>
  <text x="440" y="44" class="sub">Passenger car 4.69 × 1.83 m, turning circle Ø 11.2 m · park / reverse / turn-around</text>
  <g transform="translate(70, 96)">
    <g clip-path="url(#plot)"><rect x="-50" y="-10" width="900" height="720" fill="url(#mg)"/></g>
    <polygon points="0,0 794.88,0 794.88,420.84 775.98,637.38 20.7,547.38" fill="none" stroke="#2a2a2a" stroke-width="2.5"/>
    <g class="axis"><text x="18" y="-6">1</text><text x="54" y="-6">2</text><text x="90" y="-6">3</text><text x="126" y="-6">4</text><text x="162" y="-6">5</text><text x="198" y="-6">6</text><text x="234" y="-6">7</text><text x="270" y="-6">8</text><text x="306" y="-6">9</text><text x="342" y="-6">10</text><text x="378" y="-6">11</text><text x="414" y="-6">12</text><text x="450" y="-6">13</text><text x="486" y="-6">14</text><text x="522" y="-6">15</text><text x="558" y="-6">16</text><text x="594" y="-6">17</text><text x="630" y="-6">18</text><text x="666" y="-6">19</text><text x="702" y="-6">20</text><text x="738" y="-6">21</text><text x="774" y="-6">22</text></g>
    <g class="axis"><text x="-12" y="22">a</text><text x="-12" y="58">b</text><text x="-12" y="94">c</text><text x="-12" y="130">d</text><text x="-12" y="166">e</text><text x="-12" y="202">f</text><text x="-12" y="238">g</text><text x="-12" y="274">h</text><text x="-12" y="310">i</text><text x="-12" y="346">j</text><text x="-12" y="382">k</text><text x="-12" y="418">l</text><text x="-12" y="454">m</text><text x="-12" y="490">n</text><text x="-12" y="526">o</text><text x="-12" y="562">p</text><text x="-12" y="598">q</text><text x="-12" y="634">r</text></g>
    <g clip-path="url(#plot)" fill="#f1f1f1" stroke="#d6d6d6" stroke-width="0.8">
      <polygon points="188.64,129.24 383.04,129.24 383.04,208.44 370.44,208.44 370.44,405.54 383.04,405.54 383.04,475.74 188.64,475.74 188.64,345.24 266.04,345.24 266.04,286.74 188.64,286.74"/>
      <rect x="497.34" y="349.2" width="129.24" height="126.9"/>
      <rect x="516.96" y="473.04" width="90" height="5.94"/>
      <rect x="495" y="363.6" width="4.68" height="16.2"/>
      <rect x="117" y="18" width="72" height="54"/>
      <rect x="63" y="18" width="54" height="54"/>
      <rect x="464.04" y="18" width="108" height="72"/>
      <rect x="467.64" y="21.6" width="100.8" height="64.8"/>
      <rect x="493.2" y="45" width="50.4" height="18"/>
    </g>
    <polygon points="383.04,349.2 497.34,349.2 497.34,475.92 626.58,475.92 626.58,349.2 684.18,349.2 684.18,486.36 788.94,502.02 781.92,583.02 383.04,534.96" fill="#dfe7ee" stroke="#8aa0b4" stroke-width="1.2"/>
    <rect x="497.34" y="349.2" width="129.24" height="126.9" fill="#e6e0d4" stroke="#9a9074" stroke-width="1"/>
    <rect x="383.04" y="349.2" width="114.3" height="126.9" fill="#cfe8d6" stroke="#4a9a5c" stroke-width="1.6"/>
    <text x="440.19" y="412.65" class="lbl" fill="#2f6f43">CARPORT</text>
    <text x="440.19" y="425.65" class="dim">6.35 × 7.05 m (45 m²)</text>
    <text x="561.96" y="412.65" class="lbl" fill="#777">GARAGE</text>
    <line x1="788.94" y1="502.02" x2="781.92" y2="583.02" stroke="#c0392b" stroke-width="3" stroke-dasharray="2,2"/>
    <text x="798.94" y="542.52" class="dim" text-anchor="start">gate 3.5 m</text>
    <circle cx="531" cy="507.6" r="100.8" fill="#c0392b" fill-opacity="0.06" stroke="#c0392b" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="531" y="507.6" class="dim" fill="#c0392b">turning Ø 11.2 m</text>
    <path d="M 783.54,540 Q 612,522 522,496.8 T 440.28,417.6" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
    <g transform="translate(440.28,406.8) rotate(0)"><rect x="-16.47" y="-42.21" width="32.94" height="84.42" rx="4" fill="#3a6ea5" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1.2"/><rect x="-16.47" y="-42.21" width="32.94" height="19.8" rx="3" fill="#2a3542"/></g>
    <g transform="translate(747,540) rotate(100)"><rect x="-16.47" y="-42.21" width="32.94" height="84.42" rx="4" fill="#9aa7b3" fill-opacity="0.85" stroke="#1a1a1a" stroke-width="1.2"/><rect x="-16.47" y="-42.21" width="32.94" height="19.8" rx="3" fill="#2a3542"/></g>
    <line x1="352.8" y1="349.2" x2="352.8" y2="541.8" stroke="#1f6f43" stroke-width="0.8" marker-end="url(#arrow)"/>
    <text x="331.2" y="446.4" class="dim" transform="rotate(-90 331.2 446.4)">clear run 10.7 m</text>
  </g>
  <g transform="translate(840, 92)"><circle r="22" fill="white" stroke="#555" stroke-width="1.3"/><path d="M 0 -17 L 5 3 L 0 -5 L -5 3 Z" fill="#2a2a2a"/><path d="M 0 5 L 5 -3 L 0 17 L -5 -3 Z" fill="#999"/><text y="-26" font-size="12" font-weight="700" text-anchor="middle">N</text></g>
  <g transform="translate(872, 150)">
    <text x="0" y="0" class="ph">ASSESSMENT</text>
    <text x="0" y="20" class="ok">✓ Comfortable for a passenger car</text>
    <text x="0" y="40" class="pt" font-weight="700">Gate (car leaf)</text>
    <text x="0" y="51" class="pt" fill="#444">3.5 m ≥ 2.75 m needed. OK.</text>
    <text x="0" y="67" class="pt" font-weight="700">Driveway width</text>
    <text x="0" y="78" class="pt" fill="#444">~4.5 m — ample for a straight run.</text>
    <text x="0" y="94" class="pt" font-weight="700">Carport bay</text>
    <text x="0" y="105" class="pt" fill="#444">6.35 × 7.05 m double; nose-in +2.4 m.</text>
    <text x="0" y="121" class="pt" font-weight="700">Apron in front</text>
    <text x="0" y="132" class="pt" fill="#444">3.3–4.0 m → 10.7 m clear N–S run.</text>
    <text x="0" y="148" class="pt" font-weight="700">90° swing in</text>
    <text x="0" y="159" class="pt" fill="#444">4.5 m lane → 6.35 m bay: fine for a car</text>
    <text x="0" y="175" class="pt" fill="#444">(a long van: one correction).</text>
    <text x="0" y="187" class="pt" font-weight="700">Turn-around</text>
    <text x="0" y="198" class="pt" fill="#444">L of drive + 45 m² bay meets Ø 11.2 m:</text>
    <text x="0" y="214" class="pt" fill="#444">in forward, back-and-fill, out forward.</text>
    <text x="0" y="226" class="pt" font-weight="700">Reverse out</text>
    <text x="0" y="237" class="pt" fill="#444">straight back to lane, fwd to gate.</text>
    <text x="0" y="259" class="pt" fill="#888">Envelope: Škoda Octavia class. A larger</text>
    <text x="0" y="271" class="pt" fill="#888">SUV/van (Ø ~12 m) fits with less slack.</text>
  </g>
</svg>