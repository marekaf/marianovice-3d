<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Garden — 3D viewer</title>
<style>
  body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background: #87ceeb; }
  #info { position: absolute; top: 0; left: 0; padding: 12px 16px; background: rgba(0,0,0,0.65); color: white; z-index: 100; line-height: 1.5; max-width: 320px; border-bottom-right-radius: 8px; font-size: 13px; }
  #info b { font-size: 14px; }
  #info small { opacity: 0.75; }
  #presets { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.65); padding: 10px 12px; z-index: 100; border-radius: 6px; }
  #presets h4 { color: #fff; margin: 0 0 8px 0; font-size: 12px; opacity: 0.85; }
  #presets button { display: block; width: 100%; margin: 4px 0; padding: 6px 12px; cursor: pointer; background: #5dade2; color: white; border: none; border-radius: 4px; font-size: 13px; text-align: left; }
  #presets button:hover { background: #3a8fc9; }
  #toggles { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.65); padding: 10px 12px; z-index: 100; color: white; border-radius: 6px; font-size: 12px; }
  #toggles label { display: block; margin: 3px 0; cursor: pointer; }
  #toggles input { margin-right: 6px; }
  #legend { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.65); color: white; padding: 10px 12px; font-size: 11px; z-index: 100; border-radius: 6px; max-width: 220px; }
  #legend .swatch { display: inline-block; width: 14px; height: 14px; vertical-align: middle; margin-right: 6px; border: 1px solid rgba(255,255,255,0.3); }
  #timeBar { position: absolute; top: 100px; left: 12px; background: rgba(0,0,0,0.65); padding: 8px 12px; z-index: 100; color: white; border-radius: 6px; font-size: 12px; max-width: 340px; }
  #timeBar input[type="range"] { width: 200px; vertical-align: middle; }
  #timeBar .lbl-mono { display: inline-block; min-width: 56px; font-family: monospace; }
  #timeBar .seasons { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
  #timeBar .seasons button { background: #444; color: white; border: none; padding: 3px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; }
  #timeBar .seasons button:hover { background: #5dade2; }
  #timeBar .seasons button.active { background: #5dade2; }
  #tooltip { position: absolute; pointer-events: none; background: rgba(0,0,0,0.85); color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; opacity: 0; transition: opacity 0.15s; z-index: 200; }

<body>

<div id="info">
  <b>Garden — 3D visualization</b><br>
  <small>Left mouse: rotate · Right mouse: pan · Scroll: zoom</small><br>
  <small style="opacity:0.85">Other: <a href="editor.html" style="color:#5dade2">2D editor</a> · <a href="zahrada-plan.svg" style="color:#5dade2">2D plan</a></small>

<div id="presets">
  <h4>VIEW</h4>
  <button onclick="setPreset('iso')">Isometric (SE)</button>
  <button onclick="setPreset('top')">Top-down (plan)</button>

  <button onclick="setPreset('south')">From south (orchard)</button>

  <div><span class="swatch" style="background:#8b6f47"></span>sauna · <span class="swatch" style="background:#5dade2"></span>hot tub</div>
  <div><span class="swatch" style="background:#a87d4a"></span>terraces · <span class="swatch" style="background:#cdc1ad"></span>shelter</div>
  <div><span class="swatch" style="background:#c8a878"></span>pergola · <span class="swatch" style="background:#bdbdbd"></span>driveway</div>
  <div><span class="swatch" style="background:#7a5a3a"></span>raised beds · <span class="swatch" style="background:#5a8a5a"></span>trees</div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script src="layout.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Layout (footprints in meters) comes from layout.js — x → east, y → south (z here)
const EL = Object.fromEntries(GARDEN.elements.map(e => [e.id, e]));
const rectOf = id => EL[id].parts.find(p => p.kind === 'rect');
const circlesOf = id => EL[id].parts.filter(p => p.kind === 'circle');
const rectVerts = r => [[r.x, r.y], [r.x + r.w, r.y], [r.x + r.w, r.y + r.d], [r.x, r.y + r.d]];
const FPC = GARDEN.elements.find(e => e.id === 'firePit').parts.find(pt => pt.kind === 'circle');
const inPlot = (x, z) => { let inside = false; const pts = GARDEN.plot.vertices; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, zi] = pts[i], [xj, zj] = pts[j]; if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside; } return inside; };

// ───────────────────────── SCENE ─────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xc4d8e8, 0.008);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(22, 0, 17);
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.minDistance = 3;
controls.maxDistance = 200;

// ───────────────────────── SKY DOME (procedural gradient) ─────────────────────────
const skyGeom = new THREE.SphereGeometry(400, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    topColor:    { value: new THREE.Color(0x4a8fcf) },
    bottomColor: { value: new THREE.Color(0xc4d8e8) },
    sunPos:      { value: new THREE.Vector3(15, 50, -10).normalize() },
    sunColor:    { value: new THREE.Color(0xffe4b5) },
  },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 bottomColor;
    uniform vec3 sunPos;
    uniform vec3 sunColor;
    varying vec3 vWorldPos;
    void main() {
      vec3 dir = normalize(vWorldPos);
      float h = max(0.0, dir.y);
      vec3 sky = mix(bottomColor, topColor, pow(h, 0.6));
      // Sun glow
      float sunDot = max(0.0, dot(dir, sunPos));
      float glow = pow(sunDot, 50.0);
      sky = mix(sky, sunColor, glow * 0.7);
      gl_FragColor = vec4(sky, 1.0);
    }
  `,
  side: THREE.BackSide,
  depthWrite: false,
});
const sky = new THREE.Mesh(skyGeom, skyMat);
scene.add(sky);

// Environment map baked from the sky — regenerated only when the lighting regime changes
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(skyGeom, skyMat));
let envKey = null, envRT = null;
function updateEnv(key) {
  if (key === envKey) return;
  envKey = key;
  if (envRT) envRT.dispose();
  envRT = pmrem.fromScene(envScene, 0, 1, 1000);
  scene.environment = envRT.texture;
}

// ───────────────────────── LIGHTS ─────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.15);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0xb1e1ff, 0x386641, 0.4);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff5d0, 1.4);
sun.castShadow = true;
sun.shadow.mapSize.width = 4096;
sun.shadow.mapSize.height = 4096;
const sd = 32;
sun.shadow.camera.left = -sd;
sun.shadow.camera.right = sd;
sun.shadow.camera.top = sd;
sun.shadow.camera.bottom = -sd;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 200;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.06;
sun.target.position.set(22, 0, 17);
scene.add(sun.target);
scene.add(sun);

// Garden lamps — fixtures built later from layout elements with meta.light, lit only at night
const lampsGroup = new THREE.Group();
scene.add(lampsGroup);
const lampLights = [];
const bulbMat = new THREE.MeshStandardMaterial({ color: 0x332a12, emissive: 0xffd27a, emissiveIntensity: 0 });

// Solar position formula (lat 50°N, day-of-year + hour)
// Returns { elev, az } in radians; az measured from N clockwise (compass).
function solarPosition(dayOfYear, hour, latDeg = 50) {
  const lat = latDeg * Math.PI / 180;
  const decl = 23.45 * Math.PI / 180 * Math.sin(2 * Math.PI * (284 + dayOfYear) / 365);
  const H = (hour - 12) * 15 * Math.PI / 180;
  const sinElev = Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(H);
  const elev = Math.asin(Math.max(-1, Math.min(1, sinElev)));
  // Azimuth from south (positive west)
  const azFromSouth = Math.atan2(
    Math.sin(H),
    Math.cos(H) * Math.sin(lat) - Math.tan(decl) * Math.cos(lat)
  );
  const az = Math.PI + azFromSouth;
  return { elev, az };
}

let currentHour = 14;
let currentDay = 172;  // 21. června default

function updateSun() {
  const { elev, az } = solarPosition(currentDay, currentHour);
  const dist = 100;
  const horizDist = dist * Math.cos(elev);
  const x = horizDist * Math.sin(az);
  const y = dist * Math.sin(elev);
  const z = -horizDist * Math.cos(az);
  sun.position.set(22 + x, Math.max(2, y), 17 + z);
  let regime;
  // Below-horizon (night) handling
  if (elev < 0) {
    regime = 'night';
    sun.intensity = 0.05;
    skyMat.uniforms.topColor.value.setHex(0x0a1024);
    skyMat.uniforms.bottomColor.value.setHex(0x1a2144);
    sun.color.setHex(0x6080a0);
    ambient.intensity = 0.1;
    bulbMat.emissiveIntensity = 2;
    for (const l of lampLights) l.intensity = l.userData.night;
  } else {
    const elevDeg = elev * 180 / Math.PI;
    if (elevDeg < 8) {
      // Sunrise/sunset golden
      regime = 'golden';
      sun.color.setHex(0xff9560);
      sun.intensity = 0.8;
      skyMat.uniforms.topColor.value.setHex(0x4a4068);
      skyMat.uniforms.bottomColor.value.setHex(0xff9050);
    } else if (elevDeg < 25) {
      // Morning/late afternoon
      regime = 'low';
      sun.color.setHex(0xffd49a);
      sun.intensity = 1.15;
      skyMat.uniforms.topColor.value.setHex(0x5a8fc4);
      skyMat.uniforms.bottomColor.value.setHex(0xffc890);
    } else {
      // Daytime
      regime = 'day';
      sun.color.setHex(0xfff5d0);
      sun.intensity = 1.4;
      skyMat.uniforms.topColor.value.setHex(0x4a8fcf);
      skyMat.uniforms.bottomColor.value.setHex(0xc4d8e8);
    }
    ambient.intensity = 0.15 + Math.min(1, elevDeg / 60) * 0.15;
    bulbMat.emissiveIntensity = 0;
    for (const l of lampLights) l.intensity = 0;
  }
  skyMat.uniforms.sunPos.value.set(x, y, z).normalize();
  skyMat.uniforms.sunColor.value.copy(sun.color);
  scene.fog.color.setRGB(
    0.7 * skyMat.uniforms.bottomColor.value.r + 0.3,
    0.7 * skyMat.uniforms.bottomColor.value.g + 0.3,
    0.7 * skyMat.uniforms.bottomColor.value.b + 0.3
  );
  updateEnv(regime);
}
function setSunFromTime(hour) {
  currentHour = hour;
  updateSun();
}
updateSun();

// Axes helper
const axes = new THREE.AxesHelper(5);
axes.visible = false;
scene.add(axes);

// ───────────────────────── TERRAIN (slope SW→NE, 4 m elevation diff) ─────────────────────────
// SW corner (1.15, 30.41) = highest (y=4), NE corner (44.16, 0) = lowest (y=0)
// Plane equation: y = -0.062 x + 0.044 z + 2.733
function basePlaneHeight(x, z) {
  return Math.max(0, -0.062 * x + 0.044 * z + 2.733);
}
// Graded cut into the west slope — clamped just under the level west deck (top 2.515),
// smoothstep bank rising to natural grade; min() leaves downhill areas untouched
const CUT_BLEND = 1.8;
const cutRects = [
  { x0: 8.3, z0: 6.7, x1: 10.48, z1: 27.0, level: 2.46 },      // sidewalk strip along the house west wall
  { x0: 10.48, z0: 15.93, x1: 14.78, z1: 19.18, level: 2.46 }, // atrium
  { x0: 27.63, z0: 26.45, x1: 34.81, z1: 27.25, level: 1.965, blend: 3.5 }, // level apron in front of the garage door
  { x0: 10.48, z0: 6.68, x1: 21.28, z1: 7.18, level: 2.345, blend: 0.6 },   // drip strip — north wall
  { x0: 10.48, z0: 26.43, x1: 21.28, z1: 26.93, level: 2.345, blend: 0.6 }, // drip strip — south wall
  { x0: 21.28, z0: 7.18, x1: 21.78, z1: 11.58, level: 2.345, blend: 0.6 },  // drip strip — east wall north of the notch
];
// Pond basin — smooth bowl carved to the pond's downhill edge level
const PBOWL = (() => {
  const e = EL.pond.parts.find(pt => pt.kind === "ellipse");
  const edge = Math.min(...Array.from({ length: 16 }, (_, i) => {
    const a = i / 16 * Math.PI * 2;
    return basePlaneHeight(e.cx + Math.cos(a) * e.rx, e.cy + Math.sin(a) * e.ry);
  }));
  return { cx: e.cx, cz: e.cy, rx: e.rx, rz: e.ry, edge, depth: 0.55 };
})();
const cutSmoothstep = t => { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); };
const cutRectDist = (r, x, z) => Math.hypot(Math.max(r.x0 - x, 0, x - r.x1), Math.max(r.z0 - z, 0, z - r.z1));
function gradedHeight(x, z) {
  const base = basePlaneHeight(x, z);
  let h = base;
  for (const r of cutRects) {
    const blend = r.blend ?? CUT_BLEND;
    const d = cutRectDist(r, x, z);
    if (d >= blend) continue;
    const t = cutSmoothstep(d / blend);
    h = Math.min(h, r.level + (base - r.level) * t);
  }
  const prr = Math.sqrt(((x - PBOWL.cx) / PBOWL.rx) ** 2 + ((z - PBOWL.cz) / PBOWL.rz) ** 2);
  if (prr < 1.3) {
    if (prr <= 1) h = Math.min(h, PBOWL.edge - PBOWL.depth * 0.5 * (1 + Math.cos(prr * Math.PI)));
    else h = Math.min(h, PBOWL.edge + (base - PBOWL.edge) * cutSmoothstep((prr - 1) / 0.3));
  }
  return h;
}
function terrainHeight(x, z) {
  return gradedHeight(x, z);
}

// ───────────────────────── HELPERS ─────────────────────────
function makePolyShape(verts2d) {
  const shape = new THREE.Shape();
  shape.moveTo(verts2d[0][0], -verts2d[0][1]);
  for (let i = 1; i < verts2d.length; i++) {
    shape.lineTo(verts2d[i][0], -verts2d[i][1]);
  }
  shape.closePath();
  return shape;
}

// Box on terrain
function addBox(plotX, plotY, w, d, h, color, opts = {}) {
  const cx = plotX + w/2;
  const cz = plotY + d/2;
  let baseY = opts.skipTerrain ? 0 : terrainHeight(cx, cz);
  // sinkToMin: base at lowest footprint corner, top unchanged — no gap on sloped terrain
  if (opts.sinkToMin) {
    const minY = Math.min(...[[plotX, plotY], [plotX + w, plotY], [plotX, plotY + d], [plotX + w, plotY + d]]
      .map(([x, z]) => terrainHeight(x, z)));
    h += baseY - minY;
    baseY = minY;
  }
  const yOffset = opts.yOffset ?? 0;
  const geom = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({
    color,
    transparent: opts.opacity !== undefined,
    opacity: opts.opacity ?? 1,
    roughness: opts.roughness ?? 0.7,
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(cx, baseY + h/2 + yOffset, cz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// Extruded polygon (house) — placed on terrain by centroid
function addExtrudedPoly(verts2d, h, color) {
  const shape = makePolyShape(verts2d);
  let cx = 0, cz = 0;
  for (const v of verts2d) { cx += v[0]; cz += v[1]; }
  cx /= verts2d.length; cz /= verts2d.length;
  const baseY = terrainHeight(cx, cz);
  // Extend down to lowest vertex terrain — top unchanged, gap filled like a plinth
  const yMin = Math.min(...verts2d.map(([x, z]) => terrainHeight(x, z)));
  const geom = new THREE.ExtrudeGeometry(shape, { depth: h + (baseY - yMin), bevelEnabled: false });
  geom.rotateX(-Math.PI / 2);
  geom.translate(0, yMin, 0);
  const mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color, roughness: 0.7 }));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return { mesh, baseY };
}

// Open structure (carport/pergola): roof + 4 posts on terrain
function addOpenStructure(plotX, plotY, w, d, h, roofColor, postColor = 0x5a3e25, opacity = 0.55) {
  const group = new THREE.Group();
  const cx = plotX + w/2;
  const cz = plotY + d/2;
  // Roof at highest footprint corner + h; each post stretched from its local terrain to the roof
  const roofY = Math.max(...[[0,0],[w,0],[0,d],[w,d]].map(([ox, oz]) => terrainHeight(plotX + ox, plotY + oz))) + h;
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.18, d),
    new THREE.MeshStandardMaterial({ color: roofColor, transparent: true, opacity, roughness: 0.7 })
  );
  roof.position.set(cx, roofY, cz);
  roof.castShadow = true;
  group.add(roof);
  for (const [ox, oz] of [[0,0],[w,0],[0,d],[w,d]]) {
    const pY = terrainHeight(plotX + ox, plotY + oz);
    const ph = roofY - pY;
    const post = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, ph, 0.15),
      new THREE.MeshStandardMaterial({ color: postColor, roughness: 0.6 })
    );
    post.position.set(plotX + ox, pY + ph/2, plotY + oz);
    post.castShadow = true;
    group.add(post);
  }
  scene.add(group);
  return group;
}

// Lamellar pergola — open slat structure (wood beams with gaps, allows light through)
function addLamellarPergola(plotX, plotY, w, d, h, slatColor = 0x6e4f31, postColor = 0x5a3e25) {
  const cx = plotX + w/2;
  const cz = plotY + d/2;
  // Slat plane at highest footprint corner + h; posts stretched from local terrain to that plane
  const topY = Math.max(...[[0,0],[w,0],[0,d],[w,d]].map(([ox, oz]) => terrainHeight(plotX + ox, plotY + oz))) + h;
  const slatMat = new THREE.MeshStandardMaterial({ color: slatColor, roughness: 0.85 });
  // 4 corner posts
  for (const [ox, oz] of [[0,0],[w,0],[0,d],[w,d]]) {
    const pY = terrainHeight(plotX + ox, plotY + oz);
    const ph = topY - pY;
    const post = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, ph, 0.15),
      new THREE.MeshStandardMaterial({ color: postColor, roughness: 0.7 })
    );
    post.position.set(plotX + ox, pY + ph/2, plotY + oz);
    post.castShadow = true;
    scene.add(post);
  }
  // Top beams along long axis (W-E if d > w, else N-S)
  const longAxis = d >= w ? 'z' : 'x';
  const slatSpacing = 0.32;
  if (longAxis === 'z') {
    // Slats run W-E, spaced along Z
    const numSlats = Math.max(2, Math.floor(d / slatSpacing));
    for (let i = 0; i < numSlats; i++) {
      const z = plotY + (i + 0.5) * (d / numSlats);
      const slat = new THREE.Mesh(
        new THREE.BoxGeometry(w + 0.05, 0.08, 0.1),
        slatMat
      );
      slat.position.set(cx, topY - 0.04, z);
      slat.castShadow = true;
      scene.add(slat);
    }
  } else {
    // Slats run N-S, spaced along X
    const numSlats = Math.max(2, Math.floor(w / slatSpacing));
    for (let i = 0; i < numSlats; i++) {
      const x = plotX + (i + 0.5) * (w / numSlats);
      const slat = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.08, d + 0.05),
        slatMat
      );
      slat.position.set(x, topY - 0.04, cz);
      slat.castShadow = true;
      scene.add(slat);
    }
  }
}

// Canopy material palettes — 6 jittered materials per base color to limit material count
const canopyPalettes = new Map();
function canopyMats(baseColor) {
  if (!canopyPalettes.has(baseColor)) {
    const base = new THREE.Color(baseColor);
    canopyPalettes.set(baseColor, Array.from({ length: 6 }, () => new THREE.MeshStandardMaterial({
      color: base.clone().offsetHSL((Math.random() - 0.5) * 0.06, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.14),
      roughness: 0.9,
    })));
  }
  return canopyPalettes.get(baseColor);
}

// Tree (trunk + canopy blob cluster) on terrain
function addTree(plotX, plotY, height = 4, canopyColor = 0x5a8a5a) {
  const trunkH = height * 0.35;
  const baseY = terrainHeight(plotX, plotY);
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1, 0.24, trunkH, 7),
    new THREE.MeshStandardMaterial({ color: 0x6e4f31, roughness: 0.9 })
  );
  trunk.position.set(plotX, baseY + trunkH/2, plotY);
  trunk.castShadow = true;
  treesGroup.add(trunk);

  const mats = canopyMats(canopyColor);
  const crownY = baseY + trunkH + height * 0.35;
  for (let i = 0; i < 4; i++) {
    const a = i * 1.7 + Math.random();
    const r = height * (0.22 + Math.random() * 0.14);
    const blob = new THREE.Mesh(
      new THREE.SphereGeometry(r, 10, 7),
      mats[Math.floor(Math.random() * mats.length)]
    );
    blob.position.set(
      plotX + Math.cos(a) * height * 0.14,
      crownY + (Math.random() - 0.5) * height * 0.18,
      plotY + Math.sin(a) * height * 0.14
    );
    blob.scale.y = 0.85;
    blob.castShadow = true;
    treesGroup.add(blob);
  }
}

// Platform (terrace, sidewalk) following terrain — top surface only
function addTerrainPlatform(verts2d, thickness, color, opts = {}) {
  const shape = makePolyShape(verts2d);
  const geom = new THREE.ShapeGeometry(shape);
  geom.rotateX(-Math.PI/2);
  const pos = geom.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    pos.setY(i, terrainHeight(x, z) + thickness);
  }
  pos.needsUpdate = true;
  geom.computeVertexNormals();
  const mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
    color, roughness: opts.roughness ?? 0.7,
    map: opts.map ?? null,
    side: THREE.DoubleSide
  }));
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

// Fence segment — posts on local terrain, 3 rails per bay pitched to follow the slope
const fencePostGeo = new THREE.BoxGeometry(0.09, 1.6, 0.09);
const fencePostMat = new THREE.MeshStandardMaterial({ color: 0x6e5a40, roughness: 0.85 });
const fenceRailMat = new THREE.MeshStandardMaterial({ color: 0x8a7355, roughness: 0.8 });
function addFenceSegment(x1, z1, x2, z2) {
  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.hypot(dx, dz);
  const yaw = Math.atan2(dx, dz);
  const nBays = Math.max(1, Math.round(len / 2.5));
  for (let i = 0; i <= nBays; i++) {
    const t = i / nBays;
    const px = x1 + dx * t, pz = z1 + dz * t;
    const post = new THREE.Mesh(fencePostGeo, fencePostMat);
    post.position.set(px, terrainHeight(px, pz) + 0.8, pz);
    post.rotation.y = yaw;
    post.castShadow = true;
    fenceGroup.add(post);
  }
  for (let i = 0; i < nBays; i++) {
    const ax = x1 + dx * (i / nBays), az = z1 + dz * (i / nBays);
    const bx = x1 + dx * ((i + 1) / nBays), bz = z1 + dz * ((i + 1) / nBays);
    const y0 = terrainHeight(ax, az), y1 = terrainHeight(bx, bz);
    const horiz = Math.hypot(bx - ax, bz - az);
    const bayLen = Math.hypot(horiz, y1 - y0);
    const pitch = Math.atan2(y1 - y0, horiz);
    for (const rh of [0.35, 0.85, 1.35]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.1, bayLen), fenceRailMat);
      rail.position.set((ax + bx) / 2, (y0 + y1) / 2 + rh, (az + bz) / 2);
      rail.rotation.set(-pitch, yaw, 0, 'YXZ');
      rail.castShadow = true;
      fenceGroup.add(rail);
    }
  }
}

// Procedural speckle texture (grass/asphalt) — hsl-jittered rects over a base color
function speckleTexture(base, hue, sat, light, count = 5000) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 512;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, 512, 512);
  ctx.globalAlpha = 0.22;
  for (let i = 0; i < count; i++) {
    ctx.fillStyle = `hsl(${hue[0] + Math.random() * (hue[1] - hue[0])}, ${sat[0] + Math.random() * (sat[1] - sat[0])}%, ${light[0] + Math.random() * (light[1] - light[0])}%)`;
    ctx.fillRect(Math.random() * 512, Math.random() * 512, 1 + Math.random() * 3, 1 + Math.random() * 3);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
// ShapeGeometry UVs are in meters — repeat = 1/meters-per-tile

// Wood-plank texture — near-white base so material color stays the multiplier
const woodTex = (() => {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#efe3d0';
  ctx.fillRect(0, 0, 256, 256);
  ctx.globalAlpha = 0.12;
  for (let i = 0; i < 1200; i++) {
    ctx.fillStyle = `hsl(${28 + Math.random() * 12}, ${25 + Math.random() * 20}%, ${40 + Math.random() * 30}%)`;
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 6 + Math.random() * 20, 1 + Math.random() * 2);
  }
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#4a3a28';
  for (let y = 7; y < 256; y += 14) ctx.fillRect(0, y, 256, 1.5);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
})();

const plotVerts = GARDEN.plot.vertices;  // NW, NE, E_kink, SE, SW
// Dense 0.7 m grid clipped to the plot pentagon — a 5-vertex ShapeGeometry can't express the graded cut
function pointInPlot(x, z) {
  let inside = false;
  for (let i = 0, j = plotVerts.length - 1; i < plotVerts.length; j = i++) {
    const [xi, zi] = plotVerts[i], [xj, zj] = plotVerts[j];
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
  }
  return inside;
}
function nearestOnPlotEdge(x, z) {
  let bx = x, bz = z, bd = Infinity;
  for (let i = 0; i < plotVerts.length; i++) {
    const [ax, az] = plotVerts[i], [cx, cz] = plotVerts[(i + 1) % plotVerts.length];
    const ex = cx - ax, ez = cz - az;
    const t = Math.max(0, Math.min(1, ((x - ax) * ex + (z - az) * ez) / (ex * ex + ez * ez)));
    const px = ax + ex * t, pz = az + ez * t;
    const d = (x - px) ** 2 + (z - pz) ** 2;
    if (d < bd) { bd = d; bx = px; bz = pz; }
  }
  return [bx, bz];
}
const groundGeom = (() => {
  const xs = plotVerts.map(p => p[0]), zs = plotVerts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), z0 = Math.min(...zs), z1 = Math.max(...zs);
  const nx = Math.ceil((x1 - x0) / 0.7), nz = Math.ceil((z1 - z0) / 0.7);
  const gx = new Float64Array((nx + 1) * (nz + 1)), gz = new Float64Array((nx + 1) * (nz + 1));
  for (let j = 0; j <= nz; j++) for (let i = 0; i <= nx; i++) {
    gx[j * (nx + 1) + i] = x0 + (x1 - x0) * i / nx;
    gz[j * (nx + 1) + i] = z0 + (z1 - z0) * j / nz;
  }
  const index = [];
  const used = new Uint8Array(gx.length);
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
    const a = j * (nx + 1) + i, b = a + 1, c = a + nx + 1, d = c + 1;
    for (const tri of [[a, d, b], [a, c, d]]) {
      if (!pointInPlot((gx[tri[0]] + gx[tri[1]] + gx[tri[2]]) / 3, (gz[tri[0]] + gz[tri[1]] + gz[tri[2]]) / 3)) continue;
      index.push(tri[0], tri[1], tri[2]);
      used[tri[0]] = used[tri[1]] = used[tri[2]] = 1;
    }
  }
  // Boundary triangles keep the exact pentagon silhouette — outside verts snap onto the outline
  for (let k = 0; k < gx.length; k++) {
    if (used[k] && !pointInPlot(gx[k], gz[k])) [gx[k], gz[k]] = nearestOnPlotEdge(gx[k], gz[k]);
  }
  const pos = new Float32Array(gx.length * 3), uv = new Float32Array(gx.length * 2);
  for (let k = 0; k < gx.length; k++) {
    pos[k * 3] = gx[k];
    pos[k * 3 + 1] = terrainHeight(gx[k], gz[k]);
    pos[k * 3 + 2] = gz[k];
    uv[k * 2] = gx[k];
    uv[k * 2 + 1] = gz[k];
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(index);
  g.computeVertexNormals();
  return g;
})();

// Sedlová střecha (sedlový štít na S a J — ridge running E-W is wrong; per studie štít na south, takže ridge S-N or E-W?)
// Studie: "Dominantní sedlový štít" v jižním pohledu = gable at south face. Ridge runs perpendicular to gable face, tj. ridge S-N.
// Roof over house bounding box: x = 10.48..21.28, z = 7.18..26.43. Ridge centered along x (peak runs N-S along z).
function makeGableRoof(xMin, xMax, zMin, zMax, wallTop, peakHeight) {
  const xMid = (xMin + xMax) / 2;
  const peakY = wallTop + peakHeight;
  const verts = [
    xMin, wallTop, zMin, // 0
    xMax, wallTop, zMin, // 1
    xMid, peakY,  zMin,  // 2
    xMin, wallTop, zMax, // 3
    xMax, wallTop, zMax, // 4
    xMid, peakY,  zMax,  // 5
  ];
  const indices = [
    0,3,5, 0,5,2, // left slope — gable ends (štít) are facade, drawn separately
    1,2,5, 1,5,4, // right slope
  ];
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  return geom;
}

function makePultRoofNS(xMin, xMax, zMin, zMax, lowY, highY) {

  geom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  return geom;
}

const drivewayPts = EL.driveway.parts.find(p => p.kind === 'polygon').points;
// Dense 0.5 m grid clipped to the driveway polygon — must follow the graded apron relief
const drivewayGeom = (() => {
  const inDw = (x, z) => {
    let inside = false;
    for (let i = 0, j = drivewayPts.length - 1; i < drivewayPts.length; j = i++) {
      const [xi, zi] = drivewayPts[i], [xj, zj] = drivewayPts[j];
      if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
    }
    return inside;
  };
  const xs = drivewayPts.map(p => p[0]), zs = drivewayPts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), z0 = Math.min(...zs), z1 = Math.max(...zs);
  const step = 0.5, nx = Math.ceil((x1 - x0) / step), nz = Math.ceil((z1 - z0) / step);
  const verts = [], idx = [];
  // Concave outline: SH-clipping needs convex clips, so split into convex pieces
  const dwParts = [
    [[21.28, 19.4], [27.63, 19.4], [27.63, 26.44], [21.28, 26.44]],
    [[21.28, 26.44], [34.11, 26.44], [43.83, 27.89], [43.44, 32.39], [21.28, 29.72]],
  ];
  const clipCell = (poly, clipPts) => {
    const dwArea = clipPts.reduce((a, [px, pz], i) => {
      const [qx, qz] = clipPts[(i + 1) % clipPts.length];
      return a + px * qz - qx * pz;
    }, 0);
    const dwSgn = dwArea > 0 ? 1 : -1;
    let out = poly;
    for (let i = 0, j = clipPts.length - 1; i < clipPts.length; j = i++) {
      const [ax, az] = clipPts[j], [bx2, bz2] = clipPts[i];
      const inp = out; out = [];
      const side = (px, pz) => dwSgn * ((bx2 - ax) * (pz - az) - (bz2 - az) * (px - ax));
      for (let k = 0; k < inp.length; k++) {
        const [cx1, cz1] = inp[k], [cx2, cz2] = inp[(k + 1) % inp.length];
        const s1 = side(cx1, cz1), s2 = side(cx2, cz2);
        if (s1 >= 0) out.push([cx1, cz1]);
        if ((s1 < 0) !== (s2 < 0)) {
          const t = s1 / (s1 - s2);
          out.push([cx1 + (cx2 - cx1) * t, cz1 + (cz2 - cz1) * t]);
        }
      }
      if (!out.length) break;
    }
    return out;
  };
  const addV = (x, z) => { const id = verts.length / 3; verts.push(x, terrainHeight(x, z) + 0.05, z); return id; };
  for (const part of dwParts) for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
    const cell = clipCell([
      [x0 + i * step, z0 + j * step], [x0 + (i + 1) * step, z0 + j * step],
      [x0 + (i + 1) * step, z0 + (j + 1) * step], [x0 + i * step, z0 + (j + 1) * step],
    ], part);
    if (cell.length < 3) continue;
    const vids = cell.map(([x, z]) => addV(x, z));
    for (let k = 1; k < vids.length - 1; k++) idx.push(vids[0], vids[k + 1], vids[k]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const pos = g.attributes.position, uv = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++) { uv[i * 2] = pos.getX(i); uv[i * 2 + 1] = pos.getZ(i); }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return g;
})();
const driveway = new THREE.Mesh(

// Facade climbers — vine clusters flattened against the wall (garage E + atrium N/S walls)
function addWallClimber(x1, z1, x2, z2, nx, nz, h = 2.2) {
  const len = Math.hypot(x2 - x1, z2 - z1);
  const n = Math.max(2, Math.round(len / 1.1));
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n;
    const wx = x1 + (x2 - x1) * t, wz = z1 + (z2 - z1) * t;
    const baseY = terrainHeight(wx, wz);
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02, 0.035, h, 5),
      new THREE.MeshStandardMaterial({ color: 0x4a3a28, roughness: 0.9 })
    );
    stem.position.set(wx + nx * 0.08, baseY + h / 2, wz + nz * 0.08);
    treesGroup.add(stem);
    const blobs = 3 + Math.floor(Math.random() * 3);
    for (let b = 0; b < blobs; b++) {
      const by = baseY + 0.5 + Math.random() * (h - 0.6);
      const r = 0.22 + Math.random() * 0.2;
      const leaf = new THREE.Mesh(
        new THREE.SphereGeometry(r, 8, 6),
        new THREE.MeshStandardMaterial({ color: b % 2 ? 0x5a8a4a : 0x4d7a40, roughness: 0.9 })
      );
      leaf.scale.set(1, 1, 0.45);
      if (Math.abs(nx) > 0) leaf.scale.set(0.45, 1, 1);
      leaf.position.set(wx + nx * (0.14 + r * 0.3) + (Math.abs(nz) ? (Math.random() - 0.5) * 0.6 : 0), by, wz + nz * (0.14 + r * 0.3) + (Math.abs(nx) ? (Math.random() - 0.5) * 0.6 : 0));
      leaf.castShadow = true;
      treesGroup.add(leaf);
    }
  }
}

// ───────────────────────── PLANTING ZONES (Flera review) — vegetation scattered per meta.plant ─────────────────────────
{
  const inPoly = (pts, x, z) => {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, zi] = pts[i], [xj, zj] = pts[j];
      if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / (zj - zi) + xi) inside = !inside;
    }
    return inside;
  };
  for (const el of GARDEN.elements.filter(e => e.meta && e.meta.plant)) {
    const rects = el.parts.filter(p => p.kind === 'rect');
    const poly = el.parts.find(p => p.kind === 'polygon');
    const ell = el.parts.find(p => p.kind === 'ellipse');
    const zoneCircles = el.parts.filter(p => p.kind === 'circle');
    const excl = el.meta.exclude ? EL[el.meta.exclude].parts.find(p => p.kind === 'ellipse') : null;
    if (zoneCircles.length && !rects.length && !poly && !ell) {
      zoneCircles.forEach(c => addBush(c.cx, c.cy, Math.max(0.35, c.r), 0x5f8452));
      continue;
    }
    let area = 0, sample;
    if (rects.length) {
      area = rects.reduce((s, r) => s + r.w * r.d, 0);
      sample = () => {
        let t = Math.random() * area, r = rects[rects.length - 1];
        for (const q of rects) { if (t < q.w * q.d) { r = q; break; } t -= q.w * q.d; }
        return [r.x + Math.random() * r.w, r.y + Math.random() * r.d];
      };
    } else if (poly) {
      const xs = poly.points.map(p => p[0]), zs = poly.points.map(p => p[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), z0 = Math.min(...zs), z1 = Math.max(...zs);
      for (let i = 0; i < poly.points.length; i++) {
        const [ax, az] = poly.points[i], [bx, bz] = poly.points[(i + 1) % poly.points.length];
        area += ax * bz - bx * az;
      }
      area = Math.abs(area) / 2;
      sample = () => {
        for (let k = 0; k < 30; k++) {
          const x = x0 + Math.random() * (x1 - x0), z = z0 + Math.random() * (z1 - z0);
          if (inPoly(poly.points, x, z)) return [x, z];
        }
        return null;
      };
    } else if (ell) {
      area = Math.PI * ell.rx * ell.ry - (excl ? Math.PI * excl.rx * excl.ry : 0);
      sample = () => {
        for (let k = 0; k < 30; k++) {
          const a = Math.random() * 2 * Math.PI, rr = Math.sqrt(Math.random());
          const x = ell.cx + rr * ell.rx * Math.cos(a), z = ell.cy + rr * ell.ry * Math.sin(a);
          if (excl && ((x - excl.cx) / (excl.rx + 0.3)) ** 2 + ((z - excl.cy) / (excl.ry + 0.3)) ** 2 < 1) continue;
          return [x, z];
        }
        return null;
      };
    } else continue;
    const kind = el.meta.plant;
    const nPer = kind === 'shrubs' ? 0 : Math.round(area * (kind === 'meadow' ? 1.6 : 1.1));
    const nShr = kind === 'perennials' || kind === 'meadow' ? 0 : Math.round(area / (kind === 'shrubs' ? 2.5 : 5));
    for (let i = 0; i < nPer; i++) {
      const pt = sample();
      if (!pt || !inPlot(pt[0], pt[1])) continue;
      const r = (kind === 'meadow' ? 0.1 : 0.2) + Math.random() * (kind === 'meadow' ? 0.15 : 0.3);
      const baseY = terrainHeight(pt[0], pt[1]);
      const c = new THREE.Mesh(
        new THREE.SphereGeometry(r, 8, 6),
        new THREE.MeshStandardMaterial({ color: perennialColors[Math.floor(Math.random() * perennialColors.length)], roughness: 0.85 })
      );
      c.position.set(pt[0], baseY + r * 0.7, pt[1]);
      c.castShadow = true;
      treesGroup.add(c);
    }
    for (let i = 0; i < nShr; i++) {
      const pt = sample();
      if (!pt || !inPlot(pt[0], pt[1])) continue;
      addBush(pt[0], pt[1], 0.45 + Math.random() * 0.35, 0x5f8452);
    }
  }
}

// ───────────────────────── SMOKE FROM FIREPIT (animated spheres) ─────────────────────────
const smokeParticles = [];
{

// ───────────────────────── FENCE ─────────────────────────

// East lower with brána gap
function lerp2(a, b, t) {
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t];
}
const GT = EL.gate.parts.find(p => p.kind === 'line');
const eL1 = pEK, eL2 = pSE;
const tBranaT = (GT.y1 - eL1[1]) / (eL2[1] - eL1[1]);
const tBranaB = (GT.y2 - eL1[1]) / (eL2[1] - eL1[1]);
const gateT = lerp2(eL1, eL2, tBranaT);
const gateB = lerp2(eL1, eL2, tBranaB);
addFenceSegment(eL1[0], eL1[1], gateT[0], gateT[1]);  // east lower 1 (before gate)
addFenceSegment(gateB[0], gateB[1], eL2[0], eL2[1]);  // east lower 2 (after gate)
addFenceSegment(pSE[0], pSE[1], pSW[0], pSW[1]);      // south
addFenceSegment(pSW[0], pSW[1], pNW[0], pNW[1]);      // west

// Gate (open indication) on terrain
const gateCenterX = (gateT[0] + gateB[0]) / 2;
const gateCenterZ = (gateT[1] + gateB[1]) / 2;
const gateBaseY = terrainHeight(gateCenterX, gateCenterZ);
const gate1 = new THREE.Mesh(
  new THREE.BoxGeometry(0.08, 1.5, 2.2),
  new THREE.MeshStandardMaterial({ color: 0x3a3a3a })
);
gate1.position.set(gateCenterX - 0.6, gateBaseY + 0.75, gateCenterZ - 1);
gate1.rotation.y = -0.3;
scene.add(gate1);
const gate2 = gate1.clone();
// Mirrored leaf stays inside the fence line — both leaves open inward
gate2.position.set(gateCenterX - 0.6, gateBaseY + 0.75, gateCenterZ + 1);
gate2.rotation.y = 0.3;
scene.add(gate2);

// ───────────────────────── CAMERA PRESETS ─────────────────────────
const targetCenter = new THREE.Vector3(22, 0, 17);
window.setPreset = function(name) {
  const positions = {
    iso:    [60, 35, 55],
    top:    [22, 90, 17],
    east:   [70, 6, 30],
    north:  [22, 8, -25],
    south:  [22, 8, 60],
    ground: [22, 1.7, 17]
  };
  const targets = {
    iso:    [22, 0, 17],
    top:    [22, 0, 17],
    east:   [22, 5, 22],
    north:  [22, 5, 17],
    south:  [22, 5, 22],
    ground: [22, 1.7, 30]
  };
  const p = positions[name];
  const t = targets[name];
  // Eye level — adjust Y to actual terrain height + 1.7 m
  if (name === 'ground') {

  }
  camera.position.set(...p);

};
setPreset('iso');

// ───────────────────────── TOGGLES ─────────────────────────
document.getElementById('togglePlot').addEventListener('change', e => fenceGroup.visible = e.target.checked);
document.getElementById('toggleTrees').addEventListener('change', e => treesGroup.visible = e.target.checked);

// ───────────────────────── DATE + TIME SLIDERS ─────────────────────────
const timeSlider = document.getElementById('timeSlider');
const timeLabel = document.getElementById('timeLabel');
const daySlider = document.getElementById('daySlider');
const dateLabel = document.getElementById('dateLabel');

function dayToDate(d) {
  const md = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  const mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let m = 0, day = d;
  while (day > md[m]) { day -= md[m]; m++; }
  return `${mn[m]} ${day}`;
}

function updateTimeLabel() {
  const v = parseFloat(timeSlider.value);
  const h = Math.floor(v);
  const m = Math.round((v - h) * 60);
  timeLabel.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
  currentHour = v;
  updateSun();
}
function updateDayLabel() {
  const v = parseInt(daySlider.value);
  dateLabel.textContent = dayToDate(v);
  currentDay = v;
  // Highlight matching season button
  document.querySelectorAll('#timeBar .seasons button').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.day) === v);
  });
  updateSun();
}
timeSlider.addEventListener('input', updateTimeLabel);
daySlider.addEventListener('input', updateDayLabel);
document.querySelectorAll('#timeBar .seasons button').forEach(b => {
  b.addEventListener('click', () => {

});

// ───────────────────────── HOVER LABELS (raycaster) ─────────────────────────
const tooltip = document.getElementById('tooltip');
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const namedObjects = [];

// Add invisible hover targets for major elements
function addHoverTarget(plotX, plotY, w, d, h, name, base) {
  const geom = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshBasicMaterial({ visible: false });
  const cx = plotX + w/2, cz = plotY + d/2;
  const baseY = base ?? terrainHeight(cx, cz);
  const m = new THREE.Mesh(geom, mat);
  m.position.set(cx, baseY + h/2, cz);
  m.userData = { name };
  scene.add(m);
  namedObjects.push(m);
}
const hoverRect = (id, h) => { const r = rectOf(id); addHoverTarget(r.x, r.y, r.w, r.d, h, EL[id].name); };
addHoverTarget(HB[0], HB[1], HB[2] - HB[0], HB[3] - HB[1], 6, EL.house.name);
addHoverTarget(GA.x, GA.y, GA.w, GA.d, 3.5, EL.garage.name, garageFloorY);
hoverRect('carport', 3);
hoverRect('sauna', 3);
hoverRect('saunaShelter', 2.5);
hoverRect('pergola', 2.5);
hoverRect('eastTerrace', 0.4);
addHoverTarget(wtSidewalk.x, wtSidewalk.y, wtSidewalk.w, wtSidewalk.d, 0.4, 'West terrace — sidewalk');
hoverRect('parking', 0.3);
{
  const fp = circlesOf('firePit')[0];
  addHoverTarget(fp.cx - 1, fp.cy - 1, 3, 3, 0.5, EL.firePit.name);
  const pn = EL.pond.parts.find(p => p.kind === 'ellipse');
  addHoverTarget(pn.cx - pn.rx, pn.cy - pn.ry, 2 * pn.rx, 2 * pn.ry, 0.3, EL.pond.name);
  const beds = ['raisedBed1', 'raisedBed2', 'raisedBed3', 'raisedBed4'].map(rectOf);
  const bx = Math.min(...beds.map(b => b.x)), by = Math.min(...beds.map(b => b.y));
  const bw = Math.max(...beds.map(b => b.x + b.w)) - bx, bd = Math.max(...beds.map(b => b.y + b.d)) - by;
  addHoverTarget(bx, by, bw, bd, 0.4, 'Raised beds (4×)');
}
hoverRect('rainTank', 0.1);
hoverRect('orchard', 0.5);

window.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(namedObjects, false);
  if (hits.length > 0) {
    tooltip.textContent = hits[0].object.userData.name;
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top = (e.clientY + 12) + 'px';
    tooltip.style.opacity = 1;
  } else {
    tooltip.style.opacity = 0;
  }
});

// ───────────────────────── FIRST-PERSON MODE (WASD) ─────────────────────────
const fpState = { active: false, keys: {} };
const fpCamera = camera;
let fpYaw = 0, fpPitch = 0;
const fpSpeed = 0.18;

function lockPointer() {
  renderer.domElement.requestPointerLock();
}

document.getElementById('toggleFP').addEventListener('change', e => {
  fpState.active = e.target.checked;
  if (fpState.active) {
    controls.enabled = false;
    fpCamera.position.set(20, terrainHeight(20, 20) + 1.7, 20);
    lockPointer();
  } else {
    controls.enabled = true;
    document.exitPointerLock();
    setPreset('iso');
  }
});

document.addEventListener('keydown', e => { fpState.keys[e.key.toLowerCase()] = true; });
document.addEventListener('keyup', e => { fpState.keys[e.key.toLowerCase()] = false; });

document.addEventListener('mousemove', e => {
  if (!fpState.active || document.pointerLockElement !== renderer.domElement) return;
  fpYaw -= e.movementX * 0.002;
  fpPitch -= e.movementY * 0.002;
  fpPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, fpPitch));
});

// Per-frame scratch vectors — avoid allocating in the render loop
const _v = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();

function fpUpdate() {
  if (!fpState.active) return;
  const fwd = _v.set(Math.sin(fpYaw), 0, Math.cos(fpYaw));
  const right = _v2.set(Math.cos(fpYaw), 0, -Math.sin(fpYaw));
  if (fpState.keys['w']) fpCamera.position.addScaledVector(fwd, -fpSpeed);
  if (fpState.keys['s']) fpCamera.position.addScaledVector(fwd, fpSpeed);
  if (fpState.keys['a']) fpCamera.position.addScaledVector(right, -fpSpeed);
  if (fpState.keys['d']) fpCamera.position.addScaledVector(right, fpSpeed);
  // Stay above terrain
  const tY = terrainHeight(fpCamera.position.x, fpCamera.position.z);
  fpCamera.position.y = tY + 1.7;
  // Apply look direction
  const lookAt = _v3.set(
    fpCamera.position.x - Math.sin(fpYaw) * Math.cos(fpPitch),
    fpCamera.position.y + Math.sin(fpPitch),
    fpCamera.position.z - Math.cos(fpYaw) * Math.cos(fpPitch)
  );
  fpCamera.lookAt(lookAt);
}

// ───────────────────────── RESIZE ─────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

// ───────────────────────── WALKING TOUR (POV walkthrough) ─────────────────────────
// Each waypoint: p = [x, z] walker position, la = [x, z] look-at (always horizontal — same eye level)
// Walker stays inside the plot; every look-at frames a garden feature from viewing distance
// (never the fence up close), with the house kept out of or at the edge of the frame.
// Position and look-at each follow a Catmull-Rom spline through the waypoints — continuous
// walking speed, no stop-start at waypoints; dur = seconds to reach the NEXT waypoint.
const tourPath = [
  { p: [42.5, 29.8], la: [34, 27.5],   dur: 2.5, label: 'At the gate' },
  { p: [38, 29],     la: [31.2, 26.6], dur: 2.5, label: 'Driveway — garage' },
  { p: [33, 30.5],   la: [24, 32.5],   dur: 2.5, label: 'South lawn' },
  { p: [26, 31],     la: [4, 30.5],    dur: 2.5, label: 'Toward the orchard' },
  { p: [14, 31],     la: [2, 28.5],    dur: 3,   label: 'Orchard ahead' },
  { p: [7, 29],      la: [2.75, 24],   dur: 3,   label: 'In the orchard' },
  { p: [6, 21],      la: [2, 14],      dur: 2.5, label: 'Raised beds ahead' },
  { p: [6.5, 13],    la: [2.75, 12],   dur: 3,   label: 'At the raised beds' },
  { p: [7, 8],       la: [5, 3],       dur: 2.5, label: 'Toward the sauna' },
  { p: [8.5, 6],     la: [5, 2.5],     dur: 3,   label: 'Sauna + hot tub' },
  { p: [12, 4.5],    la: [17, 1.5],    dur: 2.5, label: 'Perennials by north fence' },
  { p: [19, 4.5],    la: [27, 2.5],    dur: 2.5, label: 'Approaching pergola' },
  { p: [24, 6.5],    la: [28.5, 3.5],  dur: 3,   label: 'At pergola + grill' },
  { p: [30, 7.5],    la: [37.5, 6.6],  dur: 2.5, label: 'Toward fire pit' },
  { p: [34.5, 9],    la: [37.5, 6.6],  dur: 3,   label: 'At fire pit' },
  { p: [38, 12],     la: [42.3, 14],   dur: 2.5, label: 'East trees (privacy)' },
  { p: [34, 12],     la: [30.8, 14.4], dur: 3,   label: 'At the pond' },
  { p: [35, 18],     la: [40.5, 23.5], dur: 2.5, label: 'Parking + rain tank' },
  { p: [39, 26],     la: [43.6, 30.1], dur: 2.5, label: 'Back at the gate' },
  { p: [40, 25],     la: [35.5, 9.5],  dur: 3,   label: 'Final overview' },
];
// Waypoints must be distinct — duplicates make the centripetal Catmull-Rom divide by zero (NaN camera)

const tourCurves = {
  walk: new THREE.CatmullRomCurve3(tourPath.map(w => new THREE.Vector3(w.p[0], 0, w.p[1])), false, 'centripetal'),
  look: new THREE.CatmullRomCurve3(tourPath.map(w => new THREE.Vector3(w.la[0], 0, w.la[1])), false, 'centripetal'),
  cum: tourPath.reduce((acc, w) => (acc.push(acc[acc.length - 1] + w.dur), acc), [0]),
};

let tourActive = false;
let tourIndex = 0;
let tourStart = 0;
const tourLabel = document.createElement('div');
tourLabel.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:white;padding:8px 16px;border-radius:6px;font-size:14px;z-index:200;pointer-events:none;opacity:0;transition:opacity 0.3s;';
document.body.appendChild(tourLabel);

window.startTour = function() {
  if (tourActive) return;
  tourActive = true;
  tourIndex = 0;
  tourStart = clock.getElapsedTime();
  controls.enabled = false;
  document.getElementById('toggleFP').checked = false;
  fpState.active = false;
};

function tourUpdate() {
  if (!tourActive) return;
  const n = tourPath.length;
  const elapsed = clock.getElapsedTime() - tourStart;
  if (elapsed >= tourCurves.cum[n - 1]) {
    tourActive = false;
    // Reset OrbitControls target so it doesn't snap camera back to house center
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    controls.target.copy(camera.position).add(dir.multiplyScalar(20));
    controls.enabled = true;
    tourLabel.style.opacity = 0;
    return;
  }
  while (elapsed >= tourCurves.cum[tourIndex + 1]) tourIndex++;
  const seg = tourPath[tourIndex];
  const localT = (elapsed - tourCurves.cum[tourIndex]) / seg.dur;
  // Spline parameter: waypoint i sits at u = i/(n-1)
  const u = Math.min(1, (tourIndex + localT) / (n - 1));
  const pos = tourCurves.walk.getPoint(u, _v);
  const la = tourCurves.look.getPoint(u, _v2);
  const py = terrainHeight(pos.x, pos.z) + 1.7;
  // LookAt at SAME eye level as walker — purely horizontal view, no looking up/down
  camera.position.set(pos.x, py, pos.z);
  camera.lookAt(la.x, py, la.z);
  // Show label
  tourLabel.textContent = `${tourIndex + 1}/${n - 1} · ${seg.label}`;
  tourLabel.style.opacity = 0.9;
}

// ───────────────────────── ANIMATE ─────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // Smoke particles rising and fading
  const smokeBaseY = terrainHeight(FPC.cx, FPC.cy);
  for (const p of smokeParticles) {
    const phase = (t * 0.4 + p.userData.phase) % 1;
    p.position.y = smokeBaseY + 0.6 + phase * 4;
    p.position.x = FPC.cx + Math.sin(t + p.userData.phase * 6) * 0.4;
    p.position.z = FPC.cy + Math.cos(t * 0.5 + p.userData.phase * 6) * 0.3;
    p.material.opacity = 0.5 * (1 - phase);
    p.scale.setScalar(1 + phase * 1.5);
  }
  // Pond water ripple drift
  waterNormal.offset.x = t * 0.008;
  waterNormal.offset.y = t * 0.005;
  if (fpState.active) fpUpdate();
  tourUpdate();
  // Skip controls.update() during tour/FP — OrbitControls.update() calls camera.lookAt(target)
  // which would override our custom lookAt and point camera at controls.target (house center)
  if (!tourActive && !fpState.active) controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
