name: browser

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable pinned Yarn
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install test dependencies
        run: yarn install --frozen-lockfile
      # verify-tour-browser.mjs draws its test panorama with ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run browser checks
        run: yarn verify:browser
        env:
          BROWSER_JOBS: 1
          BROWSER_TIMEOUT_MS: 180000
