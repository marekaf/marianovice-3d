name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Install test dependencies
        run: yarn install --frozen-lockfile
      - name: Run verification
        run: yarn verify
