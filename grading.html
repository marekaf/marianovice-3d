<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Terrain works coordination plan</title></head>
<body>
<nav><a href="index.html">Back to the model</a><button id="printPlan" hidden>Print / save PDF · A3 landscape</button></nav>
<main id="report"><h1>Preparing the terrain works plan…</h1><p>A local survey is required. The report will not substitute an approximate plane if the survey is unavailable.</p></main>
<script src="layout.js"></script><script src="terrain.js"></script><script src="privacy-screen-model.js"></script><script src="garage-model.js"></script><script src="pergola-model.js"></script><script src="greenhouse-model.js"></script><script src="raised-beds-model.js"></script><script src="hidden-bench-model.js"></script><script src="site-terrain.js"></script><script src="survey-surface.js"></script><script src="grading-site.js"></script><script src="grading-data.js?v=f637dd5ff8b5"></script><script src="grading-report.js?v=e7080ce63a0f"></script>
<script type="module">
const main=document.getElementById('report');
try {
  await new Promise((resolve,reject)=>{
    const script=document.createElement('script');script.src='docs/survey-terrain.js';
    script.onload=resolve;script.onerror=()=>reject(new Error('The local survey data is unavailable. Open this report in the local project with the survey present.'));
    document.head.append(script);
  });
  const {site,survey}=GradingSite.create({garden:GARDEN,terrain:TERRAIN,survey:SURVEY_TERRAIN});
  const baseline=undefined;
  const data=GradingData.createGradingData({garden:GARDEN,terrain:TERRAIN,site,survey,baseline});
  const report=GradingReport.render({garden:GARDEN,terrain:TERRAIN,site,survey,data,baseline});
  const style=document.createElement('style');style.textContent=report.css;document.head.append(style);
  main.innerHTML=report.html;main.dataset.revision=report.revision;
  document.getElementById('printPlan').hidden=false;
  document.getElementById('printPlan').addEventListener('click',()=>window.print());
} catch(error) {
  main.replaceChildren();const heading=document.createElement('h1');heading.textContent='Terrain plan unavailable';
  const note=document.createElement('p');note.textContent=error.message;main.append(heading,note);main.dataset.state='error';
}
</script>
</body></html>
