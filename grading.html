<!doctype html>
<html lang="cs">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zemní práce · přehled úprav terénu</title></head>
<body>
<nav><a href="index.html">Zpět do modelu</a><button id="printPlan" hidden>Tisk / uložit PDF · A3 na šířku</button></nav>
<main id="report" aria-busy="true"></main>
<script src="layout.js?v=b5549d367ca5"></script><script src="terrain.js"></script><script src="privacy-screen-model.js"></script><script src="garage-model.js"></script><script src="pergola-model.js"></script><script src="greenhouse-model.js"></script><script src="raised-beds-model.js"></script><script src="hidden-bench-model.js"></script><script src="site-terrain.js?v=17c3cfd76704"></script><script src="survey-surface.js"></script><script src="grading-site.js"></script><script src="docs/fence-survey.js"></script><script src="grading-zones.js?v=4efc421dbe85"></script><script src="grading-data.js"></script><script src="grading-overlay.js?v=d4221b2e0bd9"></script><script src="grading-report.js?v=7bb46bc0da48"></script>
<script type="module">
const main=document.getElementById('report');
try {
  await new Promise((resolve,reject)=>{
    const script=document.createElement('script');script.src='docs/survey-terrain.js';
    script.onload=resolve;script.onerror=()=>reject(new Error('Zaměření není dostupné. Otevřete přehled v místním projektu s daty zaměření.'));
    document.head.append(script);
  });
  const {site,survey}=GradingSite.create({garden:GARDEN,terrain:TERRAIN,survey:SURVEY_TERRAIN});
  const baseline=undefined;
  const data=GradingData.createGradingData({garden:GARDEN,terrain:TERRAIN,site,survey,baseline});
  const report=GradingReport.render({garden:GARDEN,terrain:TERRAIN,site,survey,data,baseline});
  const style=document.createElement('style');style.textContent=report.css;document.head.append(style);
  main.innerHTML=report.html;main.dataset.revision=report.revision;main.setAttribute('aria-busy','false');
  document.getElementById('printPlan').hidden=false;
  document.getElementById('printPlan').addEventListener('click',()=>window.print());
} catch(error) {
  main.replaceChildren();const heading=document.createElement('h1');heading.textContent='Plán terénu není dostupný';
  main.append(heading);main.dataset.state='error';main.setAttribute('aria-busy','false');
}
</script>
</body></html>
